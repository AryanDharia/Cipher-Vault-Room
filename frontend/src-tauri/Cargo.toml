[package]
name = "vaultroom-desktop"
version = "1.0.0"
description = "VaultRoom desktop client"
authors = ["VaultRoom"]
edition = "2021"

[lib]
name = "vaultroom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
