<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="vr-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0e17" />
      <stop offset="100%" stop-color="#141926" />
    </linearGradient>
    <linearGradient id="vr-cyan" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="vr-glow" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Container / Background Tile -->
  <rect width="32" height="32" rx="7" fill="url(#vr-bg)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.4" />
  
  <!-- Cyber Vault Shield -->
  <path d="M16 5 L24 8 V15.5 C24 20.8 16 26.5 16 26.5 C16 26.5 8 20.8 8 15.5 V8 L16 5 Z" fill="url(#vr-glow)" stroke="url(#vr-cyan)" stroke-width="1.75" stroke-linejoin="round" />

  <!-- Vault Shackle / Lock Body -->
  <path d="M13.5 13.5 V11 C13.5 9.62 14.62 8.5 16 8.5 C17.38 8.5 18.5 9.62 18.5 11 V13.5" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <rect x="12" y="13.5" width="8" height="6.5" rx="1.5" fill="#082f49" stroke="#22d3ee" stroke-width="1.5" />
  
  <!-- Lock Keyhole / Core dot -->
  <circle cx="16" cy="16.5" r="1.1" fill="#22d3ee" />
</svg>
